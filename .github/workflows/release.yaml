name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Derive and validate release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH[-prerelease] version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate build info and run tests
        run: |
          ./generate-build-info.sh
          ./generate-ssl-certs.sh
          go vet ./...
          go test -race ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart with release version
        run: |
          mkdir -p dist
          helm lint deployment/k8s/helm/chart
          helm package deployment/k8s/helm/chart \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Build source archive
        run: |
          git archive --format=tar.gz --prefix="http-sink-${{ steps.version.outputs.tag }}/" \
            -o "dist/http-sink-${{ steps.version.outputs.tag }}-sources.tar.gz" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*-sources.tar.gz
