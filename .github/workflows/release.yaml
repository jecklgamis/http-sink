name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Derive and validate release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH[-prerelease] version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "npm_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies and run tests
        run: |
          npm ci
          ./generate-build-info.sh
          ./generate-ssl-certs.sh
          npm test

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart with release version
        run: |
          mkdir -p dist
          helm lint deployment/k8s/helm/chart
          helm package deployment/k8s/helm/chart \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Build source archive with matching package.json version
        run: |
          ARCHIVE_ROOT="/tmp/src/http-sink-${{ steps.version.outputs.tag }}"
          mkdir -p "$ARCHIVE_ROOT"
          git archive HEAD | tar -x -C "$ARCHIVE_ROOT"
          npm --prefix "$ARCHIVE_ROOT" pkg set version="${{ steps.version.outputs.npm_version }}"
          tar -czf "dist/http-sink-${{ steps.version.outputs.tag }}-sources.tar.gz" -C /tmp/src "http-sink-${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*-sources.tar.gz
