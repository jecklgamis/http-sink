# Default values for http-sink.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: jecklgamis/http-sink
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "main"

imagePullSecrets:
  - name: dockerhub
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # With more than one replica, pin each browser to one pod so the dashboard
    # shows a consistent view instead of jumping between pods on every poll:
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/session-cookie-name: "http-sink"
  hosts:
    - host: http-sink.jecklgamis.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: http-sink
      hosts:
        - http-sink.jecklgamis.com

# Static injection rules, loaded at startup from a ConfigMap on every replica.
# The app keeps no other state, so replicas behave identically and can be
# scaled freely. Changing the rules rolls the pods (via a checksum annotation).
# Each rule matches one exact path; delay and status accept the same syntax as
# the sinkDelay / sinkStatus request parameters, including probability lists.
rules: []
  # - path: /sink/orders
  #   delay: 50ms-300ms
  #   status: "503:10,429:5"

# Extra environment variables for the container, e.g. MAX_DURATION, MAX_BODY_SIZE,
# RATE_LIMIT (0 disables the per-replica limit) or LOG_FORMAT (text|json).
extraEnv: []
  # - name: LOG_FORMAT
  #   value: json

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
