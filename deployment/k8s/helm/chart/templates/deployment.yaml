apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "http-sink.fullname" . }}
  labels:
    {{- include "http-sink.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "http-sink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.rules }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.rules }}
        checksum/rules: {{ include (print $.Template.BasePath "/configmap-rules.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "http-sink.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "http-sink.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 38080
              protocol: TCP
          {{- if or .Values.rules .Values.extraEnv }}
          env:
            {{- if .Values.rules }}
            - name: SINK_RULES_FILE
              value: /etc/http-sink/rules.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.rules }}
          volumeMounts:
            - name: rules
              mountPath: /etc/http-sink
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /probe/live
              port: http
          readinessProbe:
            httpGet:
              path: /probe/ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.rules }}
      volumes:
        - name: rules
          configMap:
            name: {{ include "http-sink.fullname" . }}-rules
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
